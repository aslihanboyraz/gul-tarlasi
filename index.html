<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gül Tarlası</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff4fa3'/%3E%3Ccircle cx='16' cy='15' r='5' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:opsz,wght@9..144,700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
      <span class="petal p1"></span>
      <span class="petal p2"></span>
      <span class="petal p3"></span>
      <span class="petal p4"></span>
      <span class="petal p5"></span>
    </div>

    <main class="app">
      <header class="hero">
        <h1><span>Gül</span> Tarlası</h1>
        <p class="tagline">İlk kare güvenli. Bir gül seni bir kez bağışlar.</p>
      </header>

      <section class="panel">
        <div class="levels" role="group" aria-label="Zorluk">
          <button type="button" class="level is-active" data-level="kolay">Kolay</button>
          <button type="button" class="level" data-level="orta">Orta</button>
          <button type="button" class="level" data-level="zor">Zor</button>
        </div>

        <div class="hud">
          <article class="chip">
            <span>Mayın</span>
            <strong id="mine-count">10</strong>
          </article>
          <article class="chip">
            <span>Süre</span>
            <strong id="time">0:00</strong>
          </article>
          <article class="chip" id="shield-chip">
            <span>Kalkan</span>
            <strong id="shield">Açık</strong>
          </article>
          <article class="chip">
            <span>En iyi</span>
            <strong id="best">—</strong>
          </article>
        </div>

        <div class="tools">
          <button type="button" class="tool is-active" id="mode-dig" aria-pressed="true">Kaz</button>
          <button type="button" class="tool" id="mode-flag" aria-pressed="false">Bayrak</button>
          <button type="button" class="tool tool-moon" id="hint">Ay Işığı <em id="hint-count">2</em></button>
          <button type="button" class="tool tool-new" id="restart">Yeni Bahçe</button>
        </div>

        <p class="status" id="status">İlk kare her zaman güvenli. Açılmış sayıya basınca komşular kontrol edilir.</p>

        <div class="board-wrap">
          <div class="board" id="board" role="grid" aria-label="Mayın tarlası"></div>
          <div class="overlay" id="overlay">
            <div class="overlay-card">
              <h2 id="overlay-title">Bahçe açtı</h2>
              <p id="overlay-text"></p>
              <button type="button" class="tool tool-new" id="overlay-again">Tekrar oyna</button>
            </div>
          </div>
        </div>
      </section>

      <p class="signature">Aslıhan Boyraz</p>
    </main>

    <div class="fx" id="fx" aria-hidden="true"></div>
    <script src="js/app.js"></script>
  </body>
</html>
